[package]
name = "teamx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "teamx - shared-goal team collaboration state kernel (Rust CLI + SQLite)"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "time"] }
axum = { version = "0.8", features = ["http1", "json", "ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
tower-http = { version = "0.6", features = ["trace", "add-extension"] }
tower = { version = "0.5", features = ["util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
futures-util = "0.3"
rcgen = { version = "0.13", default-features = false, features = ["pem", "x509-parser", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-native-roots", "connect"] }
time = { version = "0.3", features = ["formatting"] }
ring = "0.17"
x509-parser = "0.16"
base64 = "0.22"
tun = "0.8.14"
smoltcp = { version = "0.14.0", features = ["std", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "phy-tuntap_interface"] }
libc = "0.2"
serde_yaml = "0.9"

# Desktop tray (L1) — optional: needs a desktop session (macOS menu bar /
# Linux appindicator + GTK). Not required for headless servers.
tray-icon = { version = "0.24", optional = true }
tao = { version = "0.37", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[features]
default = []
gui = ["dep:tray-icon", "dep:tao", "dep:image"]

[[bin]]
name = "teamx"
path = "src/main.rs"
