name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  rust:
    name: Rust CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test

  cli-tests:
    name: CLI integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build binary
        run: cargo build
      - name: Smoke (dual-session closed loop)
        run: ./tests/smoke.sh
      - name: Edge & negative tests
        run: ./tests/cli-test.sh
      - name: Concurrency (seq ordering)
        run: ./tests/concurrency.sh

  plugin:
    name: opencode plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install + typecheck + bundle
        working-directory: opencode-plugin
        run: |
          bun install
          bunx tsc --noEmit
          bun run build
