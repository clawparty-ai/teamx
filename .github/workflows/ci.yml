name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  rust:
    name: Rust CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      - name: Clippy (deny new warnings, allow pre-existing lints)
        # The repo carries a known set of pre-existing clippy findings. We keep
        # `-D warnings` so NEW lints fail the build, while allowing that exact
        # set so the backlog does not block CI. Keep this list in sync with
        # `cargo clippy --all-targets` output; fix-and-remove entries over time.
        run: |
          cargo clippy --all-targets -- -D warnings \
            -A clippy::collapsible_if \
            -A clippy::collapsible_match \
            -A clippy::doc_overindented_list_items \
            -A clippy::empty_line_after_doc_comments \
            -A clippy::let_underscore_future \
            -A clippy::let_unit_value \
            -A clippy::manual_clamp \
            -A clippy::manual_unwrap_or_default \
            -A clippy::match_like_matches_macro \
            -A clippy::needless_borrow \
            -A clippy::result_large_err \
            -A clippy::result_unit_err \
            -A clippy::should_implement_trait \
            -A clippy::single_match \
            -A clippy::unnecessary_unwrap \
            -A clippy::useless_conversion
      - name: Unit tests
        run: cargo test

  cli-tests:
    name: CLI integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build binary
        run: cargo build
      - name: Smoke (dual-session closed loop)
        run: ./tests/smoke.sh
      - name: Edge & negative tests
        run: ./tests/cli-test.sh
      - name: Concurrency (seq ordering)
        run: ./tests/concurrency.sh

  plugin:
    name: opencode plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install + typecheck + bundle
        working-directory: opencode-plugin
        run: |
          bun install
          bunx tsc --noEmit
          bun run build
