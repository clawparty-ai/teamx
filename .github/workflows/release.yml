name: Release binaries

# Builds prebuilt `teamx` CLI binaries for Homebrew / direct download and
# uploads them to the GitHub Release created for each `v*` tag.
#
# Usage: git tag v0.3.0 && git push origin v0.3.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: teamx-aarch64-apple-darwin.tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: teamx-x86_64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: teamx-x86_64-unknown-linux-musl.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage tarball
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/teamx staging/teamx
          chmod +x staging/teamx
          tar -C staging -czf ${{ matrix.artifact }} teamx

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      # create release + upload assets. `generate_release_notes` is disabled:
      # the default GITHUB_TOKEN lacks the releases/generate-notes API scope.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
